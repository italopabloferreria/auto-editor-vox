<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f4f4f9;
        --ink: #1d2a44;
        --vox-yellow: #bbdf32;
        --vox-coral: #ff6b00;
        --muted: #5c5e64;
        --font-display: "Archivo Black", sans-serif;
        --font-body: "Inter", sans-serif;
        --font-mono: "Space Mono", monospace;
        --font-serif: "Playfair Display", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
        font-family: var(--font-body);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-hook"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-track-kind="graphics"
        data-composition-id="hook-card"
        data-composition-src="compositions/01-hook-card.html"
      ></div>
      <div
        id="scene-data"
        class="clip"
        data-start="4"
        data-duration="5"
        data-track-index="0"
        data-track-kind="graphics"
        data-composition-id="data-chart"
        data-composition-src="compositions/02-data-chart.html"
      ></div>
      <div
        id="scene-quote"
        class="clip"
        data-start="9"
        data-duration="4"
        data-track-index="0"
        data-track-kind="graphics"
        data-composition-id="quote-highlight"
        data-composition-src="compositions/03-quote-highlight.html"
      ></div>
      <div
        id="captions-layer"
        class="clip"
        data-start="0"
        data-duration="13"
        data-track-index="1"
        data-track-kind="captions"
        data-layout-allow-overlap="true"
        data-composition-id="captions-overlay"
        data-composition-src="compositions/04-captions-overlay.html"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
